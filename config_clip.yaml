dataset:
  name: coco
  root: "/content/drive/MyDrive/Cluster-Aware-CLIP/data/coco/train2017"
  ann_file: "/content/drive/MyDrive/Cluster-Aware-CLIP/data/coco/annotations/captions_train2017.json"

